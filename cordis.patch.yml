# Narraiva is a profile bundle, not a modification of the DeepSeek Harness source.
# This layer selects the local unified conversation preset, contributes the product policy seam,
# and lets Narraiva's Browser Client own the Web root.
- insert:
    # Client-module discovery keys off the Loader entry name. Use the package
    # name as the profile id so DSH can resolve this package's dsh.client face.
    - id: '@narraiva/dsh'
      name: '@narraiva/dsh'

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: narraiva-conversation

# The writing Spike is deliberately chat-only. Keep the author in control
# until Narraiva provides an explicit Proposal/Diff review surface.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true
